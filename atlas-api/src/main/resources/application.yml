spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

server:
  port: 8080

spring-ai:
  anthropic:
    api-key: ${ANTHROPIC_API_KEY:}
    chat:
      options:
        model: claude-sonnet-4-5
  openai:
    api-key: ${OPENAI_API_KEY:}
    embedding:
      options:
        model: text-embedding-3-small

atlas:
  retrieval:
    top-k: 5
    rrf-k: 60
  agent:
    tool-model: claude-haiku-4-5     # model used for tool-call steps
    answer-model: claude-sonnet-4-5  # model used for final answer generation
  cache:
    ttl-seconds: 3600

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: never
