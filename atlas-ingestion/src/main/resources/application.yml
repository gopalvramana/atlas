spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiChatAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/atlas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  main:
    web-application-type: none   # CLI runner — no web server needed
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true

spring-ai:
  openai:
    api-key: ${OPENAI_API_KEY:dummy}   # real key needed only when EmbeddingService runs
    embedding:
      options:
        model: text-embedding-3-small

atlas:
  ingestion:
    chunk-size: 512       # tokens per chunk
    chunk-overlap: 64     # token overlap between chunks
    batch-size: 100       # chunks per OpenAI embedding API call
    github:
      owner: spring-projects
      repo: spring-ai
      docs-path: spring-ai-docs/src/main/antora/modules/ROOT/pages
      token: ${GITHUB_TOKEN:}   # personal access token — set in .env
      versions:
        - label: "0.8"
          branch: "0.8.x"
        - label: "1.0-GA"
          branch: "1.0.x"
        - label: "1.1+"
          branch: "1.1.x"
      include-paths:            # subdirectories and files to ingest
        - api
        - guides
        - concepts.adoc
        - getting-started.adoc
        - upgrade-notes.adoc
      exclude-files:            # files to skip even if inside included paths
        - contribution-guidelines.adoc
        - index.adoc
